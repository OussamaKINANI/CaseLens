name: CaseLens CI

on:
  push:
    branches:
      - main

  pull_request:


permissions:
  contents: read


jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: caselens
          POSTGRES_USER: caselens
          POSTGRES_PASSWORD: ci-test-password

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U caselens -d caselens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: >-
        postgresql+psycopg://caselens:ci-test-password@localhost:5432/caselens

      TEST_DATABASE_URL: >-
        postgresql+psycopg://caselens:ci-test-password@localhost:5432/caselens_test

      AI_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      EMBEDDING_DIMENSIONS: "1536"

      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: caselens-review

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7

        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: >-
          python -m pip install
          --requirement backend/requirements.txt

      - name: Create test database
        run: |
          python - <<'PY'
          import psycopg

          connection = psycopg.connect(
              "postgresql://caselens:"
              "ci-test-password@localhost:5432/caselens",
              autocommit=True,
          )

          try:
              connection.execute(
                  "CREATE DATABASE caselens_test"
              )
          finally:
              connection.close()
          PY

      - name: Apply main database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Apply test database migrations
        working-directory: backend
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" \
            python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q


  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7

        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build